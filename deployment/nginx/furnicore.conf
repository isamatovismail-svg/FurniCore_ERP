# ==============================================================================
# FurniCore ERP — Nginx Production Virtual Host Configuration
# ==============================================================================
# Place in: /etc/nginx/sites-available/furnicore.conf
# Enable:   ln -s /etc/nginx/sites-available/furnicore.conf /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
# ==============================================================================

upstream furnicore_app {
    server 127.0.0.1:8000 fail_timeout=0;
    # Or unix socket:
    # server unix:/run/furnicore/gunicorn.sock fail_timeout=0;
}

# HTTP — Redirect all requests to HTTPS (Let's Encrypt certbot challenge supported)
server {
    listen 80;
    listen [::]:80;
    server_name erp.furnicore.kz www.erp.furnicore.kz;

    # ACME-challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.furnicore.kz www.erp.furnicore.kz;

    # SSL Certificates (managed via Certbot: certbot --nginx -d erp.furnicore.kz)
    ssl_certificate /etc/letsencrypt/live/erp.furnicore.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.furnicore.kz/privkey.pem;

    # SSL Security Configuration (Modern TLS)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Upload size limit
    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/furnicore_access.log;
    error_log /var/log/nginx/furnicore_error.log warn;

    # Static Files (collected via python manage.py collectstatic)
    location /static/ {
        alias /var/www/furnicore/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Media Files (user uploads)
    location /media/ {
        alias /var/www/furnicore/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        # Prevent execution of arbitrary scripts inside media
        location ~ \.(php|py|sh|pl|cgi)$ {
            deny all;
        }
    }

    # Health Check (allow load balancers / monitoring without authentication)
    location /health/ {
        proxy_pass http://furnicore_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Main Application Reverse Proxy
    location / {
        proxy_pass http://furnicore_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy PDF/Excel reports
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket support (for notifications if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
