# ==============================================================================
# Render Blueprint — FurniCore ERP (Free Tier Web Service)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
# NOTE: This configuration provisions ONLY a free Python web service.
# It does NOT provision paid add-ons or automatic paid databases.
# Provide DATABASE_URL from a free PostgreSQL instance (Render free Postgres,
# Neon, Supabase, etc.) via the Render Dashboard environment settings.
# ==============================================================================

services:
  - type: web
    name: furnicore-erp
    runtime: python
    plan: free
    region: frankfurt
    branch: python-django
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SEED_DEMO
        value: "false"
